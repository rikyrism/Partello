# Partello production stack for a single VPS.
#
#   cp deploy/.env.prod.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Exposes only 80/443 (Caddy, automatic HTTPS) and the TURN ports.
# Postgres and the app are reachable only inside the Docker network.
#
# Optional SFU for bigger calls (LiveKit, see deploy/README.md):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env --profile sfu up -d --build

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # LiveKit runs on the host network; Caddy reaches it through the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://partello:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/partello
      ALLOWED_ORIGINS: https://${DOMAIN}
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Caddy is the only client of the app, so its X-Forwarded-For is trusted.
      TRUST_PROXY: "true"
      LOG_FORMAT: json
      RUST_LOG: partello=info,tower_http=warn
      STUN_URLS: stun:${DOMAIN}:3478,stun:stun.l.google.com:19302
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}
      # Optional: Cloudflare Realtime TURN instead of the bundled coturn
      # (takes priority when set).
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TRENDING_REGION: ${TRENDING_REGION:-US}
      TRENDING_REFRESH_HOUR: ${TRENDING_REFRESH_HOUR:-15}
      TRENDING_UTC_OFFSET: ${TRENDING_UTC_OFFSET:-7}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-16}
      # Empty: 8 for peer-to-peer calls, everyone in the room with an SFU.
      ROOM_MAX_VOICE: ${ROOM_MAX_VOICE:-}
      # SFU calls (all three set) instead of the peer-to-peer mesh.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Optional: the push key is generated once and kept in Postgres.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: partello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: partello
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partello -d partello"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TURN relay for viewers behind carrier-grade NAT, strict Wi-Fi or office
  # firewalls. Host networking: it needs the public IP and a UDP port range.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP}
      - --min-port=49152
      - --max-port=49352
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks (the VPS's own services included).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --user-quota=24
      - --total-quota=1200

  # Optional SFU: calls with many cameras go through this media server
  # instead of every phone sending to every other phone. Host networking for
  # its UDP port range; browsers reach its signalling through Caddy (/rtc).
  livekit:
    image: livekit/livekit-server:v1.13
    profiles: ["sfu"]
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50100
          port_range_end: 50300
          use_external_ip: true
        room:
          empty_timeout: 300

volumes:
  pgdata:
  caddy_data:
  caddy_config:
